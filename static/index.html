<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STRIVA | Demi-Fine Jewelry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #FAF7F2; color: #2C2A29; }
    .font-serif { font-family: 'Cormorant Garamond', serif; }
    .hidden-view { display: none !important; }
    .text-rose-bronze { color: #8C6239; }
    .bg-rose-bronze { background-color: #8C6239; }
    .border-rose-bronze { border-color: #8C6239; }
  </style>
</head>
<body class="bg-[#FAF7F2] text-stone-800 min-h-screen flex flex-col">

  <!-- AUTH SCREEN -->
  <div id="view-auth" class="min-h-screen flex flex-col items-center justify-center p-6 bg-[#F5EFE6]">
    <div class="text-center max-w-md w-full">
      <div class="flex justify-center mb-4">
        <svg class="w-16 h-16 text-rose-bronze" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="50,10 90,50 50,90 10,50" />
          <circle cx="50" cy="50" r="18" />
        </svg>
      </div>
      <h1 class="text-5xl font-serif tracking-[0.25em] font-bold text-stone-900 mb-1">STRIVA</h1>
      <p class="text-[11px] uppercase tracking-[0.3em] text-rose-bronze mb-8">Demi-Fine Luxury • 18K Vermeil & 925 Silver</p>

      <div class="bg-white p-8 rounded-3xl shadow-sm border border-stone-200/60">
        <div class="flex justify-center space-x-6 mb-6 text-xs font-bold uppercase tracking-wider border-b pb-3">
          <button id="tab-login-btn" onclick="switchAuthTab('login')" class="text-rose-bronze border-b-2 border-rose-bronze pb-1">Sign In</button>
          <button id="tab-signup-btn" onclick="switchAuthTab('signup')" class="text-stone-400 hover:text-stone-900 pb-1">Create Account</button>
        </div>

        <form onsubmit="handleAuthSubmit(event)" class="space-y-4 text-left">
          <div id="field-name" class="hidden">
            <label class="block text-[10px] uppercase font-bold text-stone-500 mb-1">Full Name</label>
            <input type="text" id="auth-name" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-xs focus:outline-none focus:border-rose-bronze">
          </div>
          <div>
            <label class="block text-[10px] uppercase font-bold text-stone-500 mb-1">Email Address</label>
            <input type="email" id="auth-email" required class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-xs focus:outline-none focus:border-rose-bronze">
          </div>
          <div>
            <label class="block text-[10px] uppercase font-bold text-stone-500 mb-1">Password</label>
            <input type="password" id="auth-password" required class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-xs focus:outline-none focus:border-rose-bronze">
          </div>
          <button type="submit" class="w-full bg-stone-900 hover:bg-stone-800 text-stone-50 py-3 rounded-xl font-medium text-xs tracking-wider uppercase transition">
            Enter Storefront
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- MAIN SHOPPING APP -->
  <div id="view-main" class="hidden-view flex flex-col min-h-screen">
    
    <!-- NAVBAR -->
    <header class="bg-white/90 backdrop-blur-md border-b border-stone-200 sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="showSection('home')">
        <svg class="w-7 h-7 text-rose-bronze" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
          <polygon points="50,10 90,50 50,90 10,50" />
          <circle cx="50" cy="50" r="16" />
        </svg>
        <span class="text-2xl font-serif font-bold tracking-[0.2em] text-stone-900">STRIVA</span>
      </div>

      <nav class="hidden lg:flex space-x-8 text-xs font-semibold tracking-wider uppercase">
        <button onclick="showSection('home')" class="hover:text-rose-bronze">Home</button>
        <button onclick="quickFilter('women', 'minimal')" class="hover:text-rose-bronze">Women Everyday</button>
        <button onclick="quickFilter('men', 'minimal')" class="hover:text-rose-bronze">Men Everyday</button>
        <button onclick="quickFilter('women', 'wedding')" class="hover:text-rose-bronze">Wedding Collection</button>
        <button onclick="showSection('orders')" class="hover:text-rose-bronze">Orders</button>
      </nav>

      <div class="flex items-center space-x-4">
        <button onclick="toggleCartModal()" class="bg-stone-900 text-stone-50 px-4 py-2 rounded-full text-xs font-medium flex items-center gap-2">
          <span>Bag</span>
          <span id="cart-badge" class="bg-rose-bronze text-white font-bold px-2 py-0.5 rounded-full text-[10px]">0</span>
        </button>
        <button onclick="logout()" class="text-xs text-stone-400 hover:text-stone-900">Sign Out</button>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 md:p-10">

      <!-- SECTION: HOME -->
      <section id="sec-home">
        <div class="bg-[#F2ECE4] rounded-3xl p-8 md:p-12 mb-12 flex flex-col md:flex-row items-center justify-between border border-stone-200/50">
          <div class="max-w-xl">
            <span class="text-[11px] uppercase tracking-[0.25em] text-rose-bronze font-bold">18K Vermeil & Solid 925 Silver</span>
            <h1 class="text-3xl md:text-5xl font-serif mt-2 mb-4 text-stone-900 leading-tight">Everyday Fine Jewelry</h1>
            <p class="text-stone-600 text-xs md:text-sm leading-relaxed mb-6">Designed for lifetime wear. Tarnish-free, waterproof, and completely hypoallergenic.</p>
            <button onclick="showSection('catalog')" class="bg-stone-900 hover:bg-stone-800 text-stone-50 px-6 py-3 rounded-xl text-xs font-medium tracking-wider uppercase">Explore Full Collection</button>
          </div>
        </div>

        <div class="mb-10">
          <div class="flex space-x-6 border-b border-stone-200 pb-3 text-xs font-bold uppercase tracking-wider overflow-x-auto">
            <button id="tag-bestseller" onclick="loadHomeCurated('bestseller')" class="text-rose-bronze border-b-2 border-rose-bronze pb-1 whitespace-nowrap">Bestsellers</button>
            <button id="tag-trending" onclick="loadHomeCurated('trending')" class="text-stone-400 hover:text-stone-900 whitespace-nowrap">Trending Now</button>
            <button id="tag-favourites" onclick="loadHomeCurated('favourites')" class="text-stone-400 hover:text-stone-900 whitespace-nowrap">Editor's Choice</button>
            <button id="tag-festive" onclick="loadHomeCurated('festive')" class="text-stone-400 hover:text-stone-900 whitespace-nowrap">Festive & Wedding</button>
          </div>
          <div id="home-curated-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mt-8"></div>
        </div>
      </section>

      <!-- SECTION: CATALOG -->
      <section id="sec-catalog" class="hidden-view">
        <div class="bg-white p-6 rounded-2xl border border-stone-200/80 mb-8 shadow-sm">
          <h2 class="text-base font-serif font-bold text-stone-900 mb-4">Refine Catalog</h2>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1">Gender</label>
              <select id="filter-gender" onchange="fetchCatalogFromAPI()" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs focus:outline-none">
                <option value="all">All Genders</option>
                <option value="women">Women</option>
                <option value="men">Men</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1">Collection</label>
              <select id="filter-occasion" onchange="fetchCatalogFromAPI()" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs focus:outline-none">
                <option value="all">All Collections</option>
                <option value="minimal">Minimal Everyday</option>
                <option value="wedding">Wedding Collection</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1">Category</label>
              <select id="filter-subcategory" onchange="fetchCatalogFromAPI()" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs focus:outline-none">
                <option value="all">All Categories</option>
                <option value="rings">Rings</option>
                <option value="earring">Earrings</option>
                <option value="necklaces">Necklaces / Chains</option>
                <option value="bracelets">Bracelets & Cuffs</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1">Max Price</label>
              <input type="range" id="filter-price" min="999" max="10000" step="500" value="10000" oninput="fetchCatalogFromAPI()" class="w-full accent-amber-800">
              <span class="text-xs font-bold text-stone-800">₹<span id="price-disp">10,000</span></span>
            </div>
          </div>
        </div>

        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
      </section>

      <!-- SECTION: ORDERS -->
      <section id="sec-orders" class="hidden-view max-w-3xl mx-auto">
        <h2 class="text-2xl font-serif font-bold text-stone-900 mb-6">Saved Account & Orders</h2>
        <div id="orders-list" class="space-y-4"></div>
      </section>

    </main>

    <!-- PRODUCT DETAIL MODAL -->
    <div id="modal-product" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
      <div class="bg-white rounded-3xl max-w-3xl w-full p-6 md:p-8 max-h-[90vh] overflow-y-auto relative border border-stone-200 shadow-2xl">
        <button onclick="closeProductModal()" class="absolute top-5 right-5 text-stone-400 hover:text-stone-900 font-bold text-xl">✕</button>
        <div id="product-detail-content"></div>
      </div>
    </div>

    <!-- CART MODAL -->
    <div id="modal-cart" class="fixed inset-0 bg-stone-900/30 backdrop-blur-sm hidden justify-end z-50">
      <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center mb-6 border-b pb-3">
            <h2 class="text-lg font-serif font-bold text-stone-900">Your Shopping Bag</h2>
            <button onclick="toggleCartModal()" class="text-stone-400 font-bold">✕</button>
          </div>
          <div id="cart-items" class="space-y-4 max-h-[60vh] overflow-y-auto"></div>
        </div>
        <div class="border-t pt-4">
          <div class="flex justify-between font-bold text-sm mb-4">
            <span>Subtotal</span>
            <span>₹<span id="cart-total">0</span></span>
          </div>
          <button onclick="checkout()" class="w-full bg-stone-900 text-stone-50 py-3 rounded-xl text-xs font-bold uppercase tracking-wider">Place Order</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let currentUser = null;
    let cart = [];

    function switchAuthTab(type) {
      if(type === 'login') {
        document.getElementById('field-name').classList.add('hidden');
        document.getElementById('tab-login-btn').className = 'text-rose-bronze border-b-2 border-rose-bronze pb-1';
        document.getElementById('tab-signup-btn').className = 'text-stone-400 hover:text-stone-900 pb-1';
      } else {
        document.getElementById('field-name').classList.remove('hidden');
        document.getElementById('tab-signup-btn').className = 'text-rose-bronze border-b-2 border-rose-bronze pb-1';
        document.getElementById('tab-login-btn').className = 'text-stone-400 hover:text-stone-900 pb-1';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const isSignup = !document.getElementById('field-name').classList.contains('hidden');
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const name = document.getElementById('auth-name').value;

      const endpoint = isSignup ? '/api/auth/register' : '/api/auth/login';
      const body = isSignup ? { name, email, password } : { email, password };

      try {
        const res = await fetch(endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        const data = await res.json();
        if(data.status === 'success') {
          currentUser = data.user;
          document.getElementById('view-auth').classList.add('hidden-view');
          document.getElementById('view-main').classList.remove('hidden-view');
          loadHomeCurated('bestseller');
        } else { alert(data.message); }
      } catch(err) { alert('Authentication failed.'); }
    }

    function logout() {
      currentUser = null;
      document.getElementById('view-main').classList.add('hidden-view');
      document.getElementById('view-auth').classList.remove('hidden-view');
    }

    function showSection(secId) {
      ['sec-home', 'sec-catalog', 'sec-orders'].forEach(id => {
        document.getElementById(id).classList.add('hidden-view');
      });
      document.getElementById(`sec-${secId}`).classList.remove('hidden-view');
      if(secId === 'catalog') fetchCatalogFromAPI();
      if(secId === 'orders') fetchOrders();
    }

    function quickFilter(gender, occasion) {
      showSection('catalog');
      document.getElementById('filter-gender').value = gender;
      document.getElementById('filter-occasion').value = occasion;
      fetchCatalogFromAPI();
    }

    async function fetchCatalogFromAPI() {
      const gender = document.getElementById('filter-gender').value;
      const occasion = document.getElementById('filter-occasion').value;
      const sub = document.getElementById('filter-subcategory').value;
      const maxPrice = document.getElementById('filter-price').value;
      document.getElementById('price-disp').innerText = parseInt(maxPrice).toLocaleString('en-IN');

      const res = await fetch(`/api/products?gender=${gender}&occasion=${occasion}&sub_category=${sub}&max_price=${maxPrice}`);
      const data = await res.json();
      
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = '';
      if(data.products && data.products.length > 0) {
        data.products.forEach(p => grid.innerHTML += renderProductCard(p));
      } else {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-stone-400 text-xs">No items match your filters. Try clearing some selections.</div>`;
      }
    }

    async function loadHomeCurated(tag) {
      ['bestseller', 'trending', 'favourites', 'festive'].forEach(t => {
        const el = document.getElementById(`tag-${t}`);
        if(el) {
          if(t === tag) {
            el.className = 'text-rose-bronze border-b-2 border-rose-bronze pb-1 whitespace-nowrap font-bold';
          } else {
            el.className = 'text-stone-400 hover:text-stone-900 whitespace-nowrap';
          }
        }
      });

      const res = await fetch(`/api/products?tag=${tag}`);
      const data = await res.json();
      const grid = document.getElementById('home-curated-grid');
      grid.innerHTML = '';
      if(data.products) data.products.forEach(p => grid.innerHTML += renderProductCard(p));
    }

    function renderProductCard(p) {
      return `
        <div onclick="openProductModal(${p.id})" class="bg-white border border-stone-200/80 rounded-2xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition cursor-pointer group">
          <div>
            <div class="relative overflow-hidden rounded-xl mb-3">
              <img src="${p.image_url}" alt="${p.name}" class="h-56 w-full object-cover group-hover:scale-105 transition duration-500" />
              <span class="absolute top-2 left-2 text-[9px] font-bold uppercase tracking-wider text-stone-900 bg-white/90 backdrop-blur-sm px-2.5 py-1 rounded-md border border-stone-200">${p.metal}</span>
            </div>
            <span class="text-[9px] font-bold uppercase tracking-widest text-rose-bronze">${p.gender} • ${p.sub_category}</span>
            <h3 class="font-serif font-bold text-stone-900 mt-1 text-base leading-snug">${p.name}</h3>
            <div class="text-sm font-extrabold text-stone-900 mt-2">₹${parseFloat(p.price_inr).toLocaleString('en-IN')}</div>
          </div>
          <button class="mt-4 w-full bg-stone-900 group-hover:bg-amber-900 text-white py-2.5 rounded-xl text-xs font-medium uppercase tracking-wider transition">View Details</button>
        </div>
      `;
    }

    async function openProductModal(id) {
      const res = await fetch(`/api/products/${id}`);
      const data = await res.json();
      const p = data.product;

      const content = document.getElementById('product-detail-content');
      content.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div>
            <img src="${p.image_url}" alt="${p.name}" class="rounded-2xl h-80 w-full object-cover border border-stone-200" />
            <div class="mt-4 grid grid-cols-2 gap-2 text-[10px] text-stone-500">
              <div class="bg-stone-50 p-2.5 rounded-xl border border-stone-200/60">
                <span class="font-bold text-stone-800 block">Waterproof</span>
                Wear in shower or pool
              </div>
              <div class="bg-stone-50 p-2.5 rounded-xl border border-stone-200/60">
                <span class="font-bold text-stone-800 block">Hypoallergenic</span>
                Nickel & lead free
              </div>
            </div>
          </div>
          <div class="flex flex-col justify-between">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-widest text-rose-bronze">${p.metal}</span>
              <h2 class="text-2xl font-serif font-bold text-stone-900 mt-1 mb-2">${p.name}</h2>
              <div class="text-2xl font-extrabold text-stone-900 mb-4">₹${parseFloat(p.price_inr).toLocaleString('en-IN')}</div>
              
              <div class="border-t border-b border-stone-200 py-3 mb-4">
                <h4 class="text-[10px] uppercase font-bold text-stone-400 mb-1">Product Details</h4>
                <p class="text-xs text-stone-600 leading-relaxed">${p.description}</p>
              </div>

              ${p.is_customizable ? `
              <div class="mb-6">
                <label class="block text-[10px] font-bold uppercase text-stone-700 mb-1">Free Custom Engraving</label>
                <input type="text" id="engrave-input" placeholder="Initials or Date (e.g. S & A 2026)" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-xs focus:outline-none focus:border-rose-bronze">
              </div>
              ` : ''}
            </div>

            <button onclick="addToBag(${p.id}, '${p.name}', ${p.price_inr})" class="w-full bg-stone-900 hover:bg-stone-800 text-stone-50 py-3.5 rounded-xl font-medium text-xs tracking-wider uppercase transition shadow-md">
              Add To Bag • ₹${parseFloat(p.price_inr).toLocaleString('en-IN')}
            </button>
          </div>
        </div>
      `;
      
      const modal = document.getElementById('modal-product');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeProductModal() {
      const modal = document.getElementById('modal-product');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function addToBag(id, name, price) {
      const engraveInput = document.getElementById('engrave-input');
      const engrave = engraveInput ? engraveInput.value.trim() : '';
      const finalName = engrave ? `${name} [Engraved: "${engrave}"]` : name;
      
      cart.push({ id, name: finalName, price });
      updateCartUI();
      closeProductModal();
      toggleCartModal();
    }

    function updateCartUI() {
      document.getElementById('cart-badge').innerText = cart.length;
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      let total = 0;
      cart.forEach((item, index) => {
        total += item.price;
        container.innerHTML += `
          <div class="flex justify-between items-center border-b border-stone-100 pb-3 text-xs">
            <div>
              <div class="font-bold text-stone-900">${item.name}</div>
              <div class="text-stone-500 font-semibold mt-0.5">₹${item.price.toLocaleString('en-IN')}</div>
            </div>
            <button onclick="removeFromCart(${index})" class="text-red-500 text-[10px] font-bold uppercase tracking-wider hover:underline">Remove</button>
          </div>
        `;
      });
      document.getElementById('cart-total').innerText = total.toLocaleString('en-IN');
    }

    function removeFromCart(i) { cart.splice(i, 1); updateCartUI(); }
    function toggleCartModal() { document.getElementById('modal-cart').classList.toggle('hidden'); document.getElementById('modal-cart').classList.toggle('flex'); }

    async function checkout() {
      if(cart.length === 0) return alert('Your bag is empty.');
      const total = cart.reduce((acc, i) => acc + i.price, 0);
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: currentUser.id, items: cart, total_amount: total })
      });
      const data = await res.json();
      if(data.status === 'success') {
        alert('Order placed successfully!');
        cart = [];
        updateCartUI();
        toggleCartModal();
        showSection('orders');
      }
    }

    async function fetchOrders() {
      const res = await fetch(`/api/orders/${currentUser.id}`);
      const data = await res.json();
      const list = document.getElementById('orders-list');
      list.innerHTML = '';
      if(data.orders && data.orders.length > 0) {
        data.orders.forEach(o => {
          list.innerHTML += `
            <div class="bg-white border border-stone-200 p-4 rounded-2xl text-xs shadow-sm">
              <div class="flex justify-between font-bold mb-1">
                <span>Order #${o.id}</span>
                <span class="text-rose-bronze uppercase tracking-wider text-[10px] bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200">${o.status}</span>
              </div>
              <div class="text-stone-500">Total: ₹${parseFloat(o.total_amount).toLocaleString('en-IN')}</div>
            </div>
          `;
        });
      } else {
        list.innerHTML = `<div class="text-center py-10 text-stone-400 text-xs">No order history yet.</div>`;
      }
    }
  </script>
</body>
</html>
