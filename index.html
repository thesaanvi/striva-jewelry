<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Striva | Fine & Demi-Fine Jewelry</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #d4af37;
            --bg-light: #faf8f5;
            --card-bg: #ffffff;
            --text-dark: #222222;
            --text-muted: #777777;
            --border-color: #e5e0d8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); }
        .top-bar { background-color: var(--primary); color: #ffffff; text-align: center; padding: 8px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .brand-logo { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 700; letter-spacing: 4px; color: var(--primary); text-decoration: none; }
        nav ul { display: flex; list-style: none; gap: 22px; }
        nav a { text-decoration: none; color: var(--text-dark); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        nav a:hover, nav a.active { color: var(--accent); }
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .action-btn { background: none; border: none; font-size: 18px; color: var(--primary); cursor: pointer; position: relative; }
        .cart-badge { position: absolute; top: -6px; right: -10px; background-color: var(--accent); color: white; font-size: 10px; border-radius: 50%; padding: 2px 6px; font-weight: bold; }
        .filter-section { max-width: 1200px; margin: 25px auto 10px; padding: 0 20px; }
        .filter-card { background-color: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .filter-group select { padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: #fff; font-size: 13px; color: var(--text-dark); outline: none; cursor: pointer; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .section-title { font-family: 'Cinzel', serif; font-size: 22px; margin: 35px 0 20px; text-align: center; letter-spacing: 2px; color: var(--primary); position: relative; }
        .section-title::after { content: ''; display: block; width: 40px; height: 2px; background-color: var(--accent); margin: 8px auto 0; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .product-card { background-color: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); transition: transform 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.06); }
        .product-img { width: 100%; height: 260px; object-fit: cover; }
        .product-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--text-dark); }
        .product-price { font-size: 15px; font-weight: 600; color: var(--accent); margin-bottom: 15px; }
        .add-cart-btn { margin-top: auto; background-color: var(--primary); color: white; border: none; padding: 10px; border-radius: 4px; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; cursor: pointer; transition: background 0.3s; }
        .add-cart-btn:hover { background-color: var(--accent); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background-color: #fff; padding: 30px; border-radius: 8px; max-width: 480px; width: 90%; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 22px; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 11px; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px; }
        .cart-drawer { position: fixed; top: 0; right: -400px; width: 350px; height: 100%; background-color: #fff; box-shadow: -5px 0 15px rgba(0,0,0,0.1); z-index: 2001; transition: right 0.3s ease; display: flex; flex-direction: column; padding: 20px; }
        .cart-drawer.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .cart-items { flex-grow: 1; overflow-y: auto; margin: 20px 0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 13px; }
        .cart-footer { border-top: 1px solid var(--border-color); padding-top: 15px; }
        .checkout-btn { width: 100%; background-color: var(--accent); color: #fff; border: none; padding: 12px; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="top-bar">Complimentary Pan-India Express Shipping on Orders Above ₹1,999</div>

    <header>
        <div class="header-container">
            <a href="#" class="brand-logo" onclick="filterBySection('all')">STRIVA</a>
            <nav>
                <ul>
                    <li><a href="#" onclick="filterBySection('all')" id="nav-all" class="active">Home</a></li>
                    <li><a href="#" onclick="filterBySection('trending')" id="nav-trending">Trending</a></li>
                    <li><a href="#" onclick="filterBySection('best_sellers')" id="nav-best_sellers">Best Sellers</a></li>
                    <li><a href="#" onclick="filterBySection('curators_choice')" id="nav-curators_choice">Curator's Choice</a></li>
                    <li><a href="#" onclick="openModal('quizModal')">Style Quiz</a></li>
                    <li><a href="#" onclick="openModal('customModal')">Customize Yours</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="action-btn" onclick="openModal('authModal')"><i class="fa-regular fa-user"></i></button>
                <button class="action-btn" onclick="toggleCart()"><i class="fa-solid fa-bag-shopping"></i><span class="cart-badge" id="cartCount">0</span></button>
            </div>
        </div>
    </header>

    <div class="filter-section">
        <div class="filter-card">
            <div class="filter-group">
                <label>Filter For</label>
                <select id="genderFilter" onchange="applyFilters()">
                    <option value="all">All</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="couple">Couple</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Occasion</label>
                <select id="occasionFilter" onchange="applyFilters()">
                    <option value="all">All</option>
                    <option value="minimal">Minimal</option>
                    <option value="wedding">Wedding</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Category / Accessory</label>
                <select id="categoryFilter" onchange="applyFilters()"></select>
            </div>
        </div>
    </div>

    <main class="container">
        <div id="productSections"></div>
    </main>

    <!-- Modals & Cart Drawer -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('authModal')">&times;</span>
            <h2 id="authTitle" style="font-family: 'Cinzel', serif; margin-bottom: 20px;">Sign In</h2>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>Full Name</label>
                    <input type="text" id="authName" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" required placeholder="user@striva.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="add-cart-btn" style="width: 100%; padding: 12px;" id="authSubmitBtn">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 12px; color: var(--text-muted);">
                <span id="authToggleText">Don't have an account?</span> 
                <a href="#" onclick="toggleAuthMode()" style="color: var(--accent); font-weight: bold;">Create Account</a>
            </p>
        </div>
    </div>

    <div id="quizModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('quizModal')">&times;</span>
            <h2 style="font-family: 'Cinzel', serif; margin-bottom: 15px;">Discover Your Style</h2>
            <div class="form-group">
                <label>Preferred Aesthetic</label>
                <select id="quizTone">
                    <option value="minimal">Sleek & Minimalist</option>
                    <option value="wedding">Bold & Heritage Wedding</option>
                </select>
            </div>
            <button class="add-cart-btn" style="width: 100%; padding: 12px;" onclick="submitQuiz()">Show Recommendations</button>
        </div>
    </div>

    <div id="customModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('customModal')">&times;</span>
            <h2 style="font-family: 'Cinzel', serif; margin-bottom: 15px;">Bespoke Studio</h2>
            <div class="form-group">
                <label>Custom Engraving</label>
                <input type="text" placeholder="Initials, Name, or Date">
            </div>
            <button class="add-cart-btn" style="width: 100%; padding: 12px;" onclick="submitCustomization()">Request Bespoke Quote</button>
        </div>
    </div>

    <div id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <h3 style="font-family: 'Cinzel', serif;">Your Shopping Bag</h3>
            <span class="close-modal" onclick="toggleCart()">&times;</span>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 12px;">
                <span>Total Amount:</span>
                <span id="cartTotal">₹0</span>
            </div>
            <button class="checkout-btn" onclick="alert('Proceeding to Secure Checkout')">CHECKOUT</button>
        </div>
    </div>

    <script>
        let currentSection = 'all';
        let cart = [];
        let isSignUp = false;

        const baseCategories = [
            { value: 'all', text: 'All Accessories' },
            { value: 'rings', text: 'Rings' },
            { value: 'bracelets', text: 'Bracelets' },
            { value: 'necklace chain', text: 'Necklaces & Chains' },
            { value: 'anklets', text: 'Anklets' }
        ];

        window.onload = function() {
            updateCategoryOptions();
            fetchProducts();
        };

        function updateCategoryOptions() {
            const gender = document.getElementById('genderFilter').value;
            const occasion = document.getElementById('occasionFilter').value;
            const categorySelect = document.getElementById('categoryFilter');
            categorySelect.innerHTML = '';
            let categories = [...baseCategories];

            if (occasion === 'wedding' || occasion === 'all') {
                if (gender === 'female' || gender === 'all') {
                    categories.push(
                        { value: 'nosering', text: 'Nose Rings' },
                        { value: 'mang tikka', text: 'Maang Tikkas' },
                        { value: 'mangalsutra', text: 'Mangalsutras' }
                    );
                }
            }

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.value;
                opt.innerText = cat.text;
                categorySelect.appendChild(opt);
            });
        }

        function fetchProducts() {
            const gender = document.getElementById('genderFilter').value;
            const occasion = document.getElementById('occasionFilter').value;
            const category = document.getElementById('categoryFilter').value;

            let url = `/api/products?gender=${gender}&occasion=${occasion}&category=${category}`;
            if (currentSection !== 'all') url += `&section=${currentSection}`;

            fetch(url)
                .then(res => res.json())
                .then(data => renderProducts(data))
                .catch(err => console.error("Error fetching products:", err));
        }

        function applyFilters() {
            updateCategoryOptions();
            fetchProducts();
        }

        function filterBySection(sectionName) {
            currentSection = sectionName;
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${sectionName}`);
            if (activeNav) activeNav.classList.add('active');
            fetchProducts();
        }

        function renderProducts(products) {
            const container = document.getElementById('productSections');
            container.innerHTML = '';

            if (!products || products.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding: 50px; color: var(--text-muted);">No products match your selected filters.</p>`;
                return;
            }

            const sections = [
                { key: 'trending', title: 'Trending Accessories' },
                { key: 'best_sellers', title: 'Best Sellers' },
                { key: 'curators_choice', title: "Curator's Choice" }
            ];

            sections.forEach(sec => {
                const sectionItems = products.filter(p => p.section === sec.key);
                if (sectionItems.length > 0) {
                    const secHeader = document.createElement('h2');
                    secHeader.className = 'section-title';
                    secHeader.innerText = sec.title;
                    container.appendChild(secHeader);

                    const grid = document.createElement('div');
                    grid.className = 'product-grid';

                    sectionItems.forEach(item => {
                        grid.innerHTML += `
                            <div class="product-card">
                                <img src="${item.image}" class="product-img" alt="${item.name}">
                                <div class="product-info">
                                    <div class="product-title">${item.name}</div>
                                    <div class="product-price">₹${item.price.toLocaleString('en-IN')}</div>
                                    <button class="add-cart-btn" onclick="addToCart('${item.name}', ${item.price})">Add to Bag</button>
                                </div>
                            </div>
                        `;
                    });
                    container.appendChild(grid);
                }
            });
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight: 600;">${item.name}</div>
                            <div style="color: var(--accent);">₹${item.price.toLocaleString('en-IN')}</div>
                        </div>
                        <i class="fa-solid fa-trash" style="cursor:pointer; color: #cc0000;" onclick="removeFromCart(${index})"></i>
                    </div>
                `;
            });
            document.getElementById('cartTotal').innerText = `₹${total.toLocaleString('en-IN')}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() { document.getElementById('cartDrawer').classList.toggle('open'); }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('authTitle').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('authSubmitBtn').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('nameGroup').style.display = isSignUp ? "block" : "none";
            document.getElementById('authToggleText').innerText = isSignUp ? "Already have an account?" : "Don't have an account?";
        }

        function handleAuth(e) {
            e.preventDefault();
            alert(isSignUp ? "Account created successfully!" : "Signed in successfully!");
            closeModal('authModal');
        }

        function submitQuiz() {
            const tone = document.getElementById('quizTone').value;
            document.getElementById('occasionFilter').value = tone;
            applyFilters();
            closeModal('quizModal');
        }

        function submitCustomization() {
            alert("Your custom request has been logged. Our design team will contact you!");
            closeModal('customModal');
        }
    </script>
</body>
</html>
